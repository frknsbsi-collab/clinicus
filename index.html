<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f8b8d">
  <meta name="description" content="Clinicus — hekimler için kişisel işlem ve hasta kayıt defteri. Veriler yalnızca cihazınızda saklanır.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Clinicus">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Clinicus</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <img src="icon.svg" alt="" class="logo">
    <div>
      <div class="brand">Clinicus</div>
      <div class="brand-sub" id="clinicLabel"></div>
    </div>
  </header>

  <main id="main"></main>

  <nav class="nav" aria-label="Ana menü">
    <div class="nav-inner">
      <button data-tab="patients"><span data-icon="users"></span>Hastalar</button>
      <button data-tab="home"><span data-icon="home"></span>Anasayfa</button>
      <button data-tab="earnings"><span data-icon="chart"></span>Kazanç</button>
      <button data-tab="settings"><span data-icon="sliders"></span>Ayarlar</button>
    </div>
  </nav>

  <dialog id="sheet"></dialog>
  <dialog id="confirm"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
